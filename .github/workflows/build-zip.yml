name: Build and Upload ZIP

on:
  push:
    branches:
      - main # Замени на свою ветку (например, master)

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Удаляем файлы из .distignore
      - name: Remove files from .distignore
        run: |
          xargs -a .distignore rm -rf || true

      # Создаём архив
      - name: Create ZIP archive
        run: |
          mkdir -p ${{ github.event.repository.name }}
          mv !("${{ github.event.repository.name }}") ${{ github.event.repository.name }}/
          zip -r ${{ github.event.repository.name }}-${{ github.ref_name }}.zip ${{ github.event.repository.name }}/

      # Загружаем артефакт в GitHub Actions
      - name: Upload artifact to GitHub Actions
        uses: actions/upload-artifact@v4 # Вот здесь убрал ⚡️!
        with:
          name: Extension-ZIP
          path: ${{ github.event.repository.name }}-${{ github.ref_name }}.zip