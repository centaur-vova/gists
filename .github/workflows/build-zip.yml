name: Build and Upload ZIP

on:
  # Триггер на каждый пуш в main (или master)
  push:
    branches:
      - main # Замени на твою основную ветку, если она называется иначе

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove files from .distignore
        run: |
          xargs -a .distignore rm -rf || true

      - name: Create ZIP archive
        run: |
          mkdir -p ${{ github.event.repository.name }}
          mv !("${{ github.event.repository.name }}") ${{ github.event.repository.name }}/ # Перемещаем все нужные файлы в папку с именем проекта
          zip -r ${{ github.event.repository.name }}-${{ github.ref_name }}.zip ${{ github.event.repository.name }}/

      - name: Upload artifact to GitHub Actions
        uses: actions/upload-artifact@v3
        with:
          name: Extension-ZIP
          path: ${{ github.event.repository.name }}-${{ github.ref_name }}.zip
