name: Build and Upload ZIP

on:
  push:
    branches:
      - main # Замени на свою ветку (например, master)

jobs:
  build-and-upload:
    runs-on: ubuntu-24 # Используем стабильную версию ОС

    steps:
      - name: Checkout code 📋
        uses: actions/checkout@v4

      # ⚠️ Важный шаг! Устанавливаем Node.js 24.
      # Это действие нужно для корректной работы checkout@v4.
      - name: Setup Node.js ✅
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Удаляем файлы из .distignore (без сложных конструкций!)
      - name: Remove files from .distignore 🗑️
        run: |
          find . -type f | grep -Fxvf <(cat .